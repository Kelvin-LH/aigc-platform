name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install fastapi uvicorn sqlalchemy pyjwt python-multipart pydantic-settings httpx
      - name: Import check & API smoke test
        run: |
          python -c "from app.main import app; print('app import ok')"
          python - <<'EOF'
          import time
          from fastapi.testclient import TestClient
          from app.main import app

          with TestClient(app) as c:
              r = c.post('/api/v1/auth/login', json={'username': 'admin', 'password': 'admin123'})
              assert r.status_code == 200, r.text
              h = {'Authorization': f"Bearer {r.json()['access_token']}"}
              r = c.post('/api/v1/generate/text-to-video', json={
                  'task_type': 'text-to-video', 'prompt': 'test clip', 'model_profile': 'standard'},
                  headers=h)
              assert r.status_code == 200, r.text
              tid = r.json()['id']
              time.sleep(15)
              r = c.get(f'/api/v1/tasks/{tid}', headers=h)
              assert r.json()['status'] == 'SUCCEEDED', r.text
              r = c.post('/api/v1/generate/image-edit',
                         json={'task_type': 'image-to-image', 'prompt': 'x'}, headers=h)
              assert r.status_code == 422, r.text
              print('e2e smoke ok')
          EOF

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
