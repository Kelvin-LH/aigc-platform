server {
    listen 80;
    client_max_body_size 200m;

    location /api/ {
        proxy_pass http://backend:8600;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        # SSE
        proxy_buffering off;
        proxy_cache off;
    }

    location /files/ {
        proxy_pass http://backend:8600;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
